# P6-A local scaffold only. Never pass this file to V1 production release scripts.
name: xiaowork-homepage-v11-dev

x-api: &api
  image: xiaowork-homepage-api:p6a-dev
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=32m,mode=1777
  volumes:
    - admin-db:/data
    - admin-uploads:/uploads
  networks: [isolated]
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  api-init:
    <<: *api
    command: [migrate]
    restart: 'no'
    healthcheck:
      disable: true
  api:
    <<: *api
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      api-init:
        condition: service_completed_successfully
    restart: 'no'
  frontend:
    image: xiaowork-homepage:p6a-dev
    build:
      context: .
      target: runtime
      args:
        NUXT_PUBLIC_SITE_URL: https://xiaoworks.com
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [isolated]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  gateway:
    image: nginx:1.30.6-alpine
    user: nginx
    entrypoint: [nginx, -g, 'daemon off;']
    ports:
      - '127.0.0.1:${V11_DEV_PORT:-3210}:8080'
    volumes:
      - ./deploy/admin-dev/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks: [edge, isolated]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health.json']
      interval: 5s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  edge:
  isolated:
    internal: true

volumes:
  admin-db:
  admin-uploads:
