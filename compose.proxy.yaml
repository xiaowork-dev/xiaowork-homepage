# Docker Compose >= 2.24.4. Use this file alone; it inherits the runtime restrictions.
name: xiaowork-homepage

services:
  web:
    extends:
      file: compose.yaml
      service: web
    ports: !reset []
    networks:
      proxy:
        aliases:
          - '${PROXY_SERVICE_ALIAS:?Set a unique proxy service alias}'

networks:
  proxy:
    external: true
    name: '${PROXY_NETWORK:?Set the existing NPM Docker network}'
