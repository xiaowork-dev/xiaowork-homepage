# The only host listener is loopback. 1Panel OpenResty terminates HTTPS and
# forwards the original Host; never expose this HTTP listener on a public IP.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format limited '$request_method $uri $status';
  access_log /dev/stdout limited;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080 default_server;
    location = /health.json { proxy_pass http://publication-static:8080/health.json; }
    location / { return 444; }
  }
  server {
    listen 8080;
    server_name xiaoworks.com;
    absolute_redirect off;
    client_max_body_size 11m;
    location = /api/admin/v1 {
      proxy_pass http://api:8081;
      proxy_set_header Host xiaoworks.com;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /api/admin/v1/ {
      proxy_pass http://api:8081;
      proxy_set_header Host xiaoworks.com;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
    }
    include /etc/nginx/xiaowork-locations.conf;
  }
}
