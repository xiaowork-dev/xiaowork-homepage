worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  log_format limited '$request_method $uri $status';
  access_log /dev/stdout limited;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    absolute_redirect off;
    client_max_body_size 11m;
    location = /admin {
      add_header Cache-Control no-store always;
      add_header X-Robots-Tag 'noindex, nofollow' always;
      return 307 /admin/;
    }
    location ^~ /admin/ {
      default_type 'text/plain; charset=utf-8';
      add_header Cache-Control no-store always;
      add_header X-Robots-Tag 'noindex, nofollow' always;
      add_header X-Content-Type-Options nosniff always;
      return 503 'XiaoWork V1.1 / P6-A\n独立开发环境已建立。后台登录、内容管理和发布功能尚未实现。\n';
    }
    location = /dev-health/api {
      proxy_pass http://api:8081/readyz;
    }
    location = /api/admin/v1 {
      proxy_pass http://api:8081;
    }
    location ^~ /api/admin/v1/ {
      proxy_pass http://api:8081;
    }
    location / {
      proxy_pass http://frontend:8080;
      proxy_set_header Host $http_host;
    }
  }
}
