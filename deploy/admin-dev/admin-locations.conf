# Only registered admin pages receive the SPA shell. Missing assets and unknown
# pages must remain 404; API routes never fall back to HTML.
location = /admin {
  include /etc/nginx/xiaowork-admin-headers.conf;
  return 307 /admin/;
}
location = /admin/ {
  root /srv;
  include /etc/nginx/xiaowork-admin-headers.conf;
  try_files /admin/index.html =503;
}
location ~ ^/admin/(login|projects|categories|media|profile|settings|account)/?$ {
  root /srv;
  include /etc/nginx/xiaowork-admin-headers.conf;
  try_files /admin/index.html =503;
}
location ^~ /admin/assets/ {
  root /srv;
  include /etc/nginx/xiaowork-admin-headers.conf;
  try_files $uri =404;
}
location = /admin/theme-init.js {
  root /srv;
  include /etc/nginx/xiaowork-admin-headers.conf;
  try_files $uri =404;
}
location /admin/ {
  include /etc/nginx/xiaowork-admin-headers.conf;
  return 404;
}
