worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format limited '$request_method $uri $status';
  access_log /dev/stdout limited;
  server_tokens off;
  sendfile on;
  open_file_cache off;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    absolute_redirect off;
    charset utf-8;
    root /publications/current/public;
    index index.html;
    include /etc/nginx/security-headers.conf;

    # Only immutable public asset subtrees are served by a historical ID.
    location ~ "^/_releases/(?<release>rel_[0-9a-f]{32})/(?<resource>(?:_nuxt|assets)/[A-Za-z0-9_./-]+)$" {
      alias /publications/releases/$release/public/_releases/$release/$resource;
      disable_symlinks on from=/publications/releases;
      add_header Cache-Control 'public, max-age=31536000, immutable' always;
      include /etc/nginx/security-headers.conf;
    }
    location /_releases/ { return 404; }

    # Keep already-open V1.0 clients working; new HTML uses versioned URLs.
    location /_nuxt/ { proxy_pass http://frontend:8080; }
    location /images/ { proxy_pass http://frontend:8080; }
    location = /favicon.svg { proxy_pass http://frontend:8080; }
    location = /theme-init.js { proxy_pass http://frontend:8080; }

    location ~ ^/(?:index\.html|projects(?:/index\.html|/)?|about(?:/index\.html|/)?|health\.json|robots\.txt|sitemap\.xml|__xiaowork-release\.json|(?:200|404)\.html|)$ {
      error_page 418 = @legacy;
      if (!-f /publications/current/public/__xiaowork-release.json) { return 418; }
      try_files $uri $uri/ =404;
      add_header Cache-Control 'no-store' always;
      include /etc/nginx/security-headers.conf;
    }
    location @legacy {
      proxy_pass http://frontend:8080;
      add_header Cache-Control 'no-store' always;
      include /etc/nginx/security-headers.conf;
    }
    # No HTTP access to snapshots, staging, previews, activation receipts or manifests.
    location / { return 404; }
  }
}
