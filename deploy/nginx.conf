worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    # Preserve the public port and HTTPS scheme behind Docker/reverse proxies.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Repeat security headers in locations that add cache headers (Nginx inheritance).
    include /etc/nginx/security-headers.conf;

    location / {
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }

    location /_nuxt/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
    }

    location /images/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400";
      include /etc/nginx/security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
