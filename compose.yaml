name: xiaowork-homepage

services:
  web:
    image: xiaowork-homepage:${IMAGE_TAG:-p5a-local}
    build:
      context: .
      target: runtime
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        VCS_REF: ${XIAOWORK_SOURCE_REVISION:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3100}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
